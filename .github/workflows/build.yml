name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bootstrap pinned idevice dependency
        run: ./scripts/bootstrap-vendor.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LocationSpoof.xcodeproj \
            -scheme LocationSpoof \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate bundle metadata
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/LocationSpoof.app"
          EXT="$APP/PlugIns/LocalTunnel.appex"
          test -d "$APP"
          test -d "$EXT"
          for plist in "$APP/Info.plist" "$EXT/Info.plist"; do
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist"
          done

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/LocationSpoof.app"
          rm -rf "$PWD/dist"
          mkdir -p "$PWD/dist/Payload"
          cp -R "$APP_PATH" "$PWD/dist/Payload/LocationSpoof.app"
          cd "$PWD/dist"
          /usr/bin/zip -qry LocationSpoof-unsigned.ipa Payload
          /usr/bin/unzip -l LocationSpoof-unsigned.ipa | tail -n 20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoof-unsigned-ipa
          path: dist/LocationSpoof-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
