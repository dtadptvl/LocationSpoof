name: LocationSpoof
options:
  bundleIdPrefix: com.dtadptvl
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  LocationSpoof:
    type: application
    platform: iOS
    sources:
      - path: LocationSpoof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtadptvl.LocationSpoof
        INFOPLIST_FILE: LocationSpoof/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocationSpoof/LocationSpoof.entitlements
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
    dependencies:
      - target: LocalTunnel
        embed: true
  LocalTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtadptvl.LocationSpoof.LocalTunnel
        INFOPLIST_FILE: LocalTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalTunnel/LocalTunnel.entitlements
        SKIP_INSTALL: YES
